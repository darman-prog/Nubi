<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nubi y el Archipiélago del Sueño</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F5FF;
      --surface: #FFFFFF;
      --text: #1E1B3A;
      --muted: #4B4777;
      --primary: #5043C9;
      --accent: #FFC15A;
      --line: #E2D9FF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2B2745;
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--text);
    }
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      max-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }
    /* Hero: la imagen solo ocupa la mitad superior y se funde con el fondo. */
    .hero {
      position: relative;
      flex: 1;
      min-height: 340px;
      background: url('../../../arte/hero-portada.webp') center top / cover no-repeat;
    }
    .hero-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      z-index: 2;
      padding-top: 56px;
    }
    /* Logo tipo "cartel de nube": silueta blanca + wordmark. */
    .logo {
      position: relative;
      width: 340px;
      height: 118px;
      margin-top: 0;
    }
    .logo-cloud {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 10px 18px rgba(80, 67, 201, 0.18));
    }
    .logo-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 14px;
      text-align: center;
    }
    .logo-name {
      font-family: 'Fredoka', sans-serif;
      font-size: 50px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 1px;
      color: var(--text);
    }
    .logo-sub {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.2px;
    }
    /* Panel inferior limpio: aquí viven los textos y las acciones. */
    .panel {
      position: relative;
      z-index: 3;
      flex: 0 0 auto;
      margin-top: -22px;
      background: var(--surface);
      border-radius: 26px 26px 0 0;
      padding: 22px 22px 18px;
      box-shadow: 0 -12px 30px rgba(80, 67, 201, 0.10);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .subtitle {
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
      padding: 0 6px;
    }
    .cta {
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-family: 'Fredoka', sans-serif;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(80, 67, 201, 0.28);
    }
    .cta:active { transform: scale(0.98); }
    .continue {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      box-shadow: 0 6px 18px rgba(80, 67, 201, 0.08);
      cursor: pointer;
      text-align: left;
    }
    .continue-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #F0EDFF;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .continue-text { flex: 1; min-width: 0; }
    .continue-title {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .continue-sub {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .dots {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E5E0FA;
    }
    .dot.on { background: var(--primary); }
    .note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--muted);
      text-align: center;
    }
    .note svg { flex-shrink: 0; }
    .footer {
      margin-top: 2px;
      padding-top: 8px;
      display: flex;
      justify-content: center;
    }
    .footer a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 999px;
    }
    .footer a:hover { background: #F0EDFF; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="hero" aria-label="Archipiélago del Sueño">
      <div class="hero-center">
        <div class="logo">
      <svg class="logo-cloud" viewBox="0 0 300 104" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <linearGradient id="cloud-fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" />
            <stop offset="0.65" stop-color="#FFFFFF" />
            <stop offset="1" stop-color="#E3ECF8" />
          </linearGradient>
          <filter id="cloud-shadow" x="-10%" y="-20%" width="120%" height="150%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A5F" flood-opacity="0.18" />
          </filter>
        </defs>
        <path
          transform="translate(0 -4)"
          fill="url(#cloud-fill)"
          filter="url(#cloud-shadow)"
          d="M38 94 H262
            A20 20 0 0 0 262 54
            A26 26 0 0 0 214 36
            A36 36 0 0 0 150 22
            A30 30 0 0 0 96 40
            A31 31 0 0 0 38 54
            A20 20 0 0 0 38 94 Z"
        />
      </svg>
          <div class="logo-text">
            <span class="logo-name">Nubi</span>
            <span class="logo-sub">y el Archipiélago del Sueño</span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel" aria-label="Inicio del viaje">
      <p class="subtitle">
        Un viaje para entender tu sueño: aprende, juega y gana tu sello en cada isla.
      </p>

      <button class="cta" type="button">
        Comenzar viaje
        <span aria-hidden="true">→</span>
      </button>

      <button class="continue" type="button" aria-label="Seguir donde quedaste: 2 de 6 islas exploradas">
        <span class="continue-icon" aria-hidden="true">▶</span>
        <span class="continue-text">
          <span class="continue-title">Seguir donde quedaste</span>
          <span class="continue-sub">2 de 6 islas exploradas</span>
        </span>
        <span class="dots" aria-hidden="true">
          <span class="dot on"></span><span class="dot on"></span>
          <span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span>
        </span>
      </button>

      <p class="note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        Sin cuentas ni contraseñas: tu viaje se queda en tu celular.
      </p>

      <div class="footer">
        <a href="#fuentes">📖 Fuentes y ayuda</a>
      </div>
    </section>
  </main>
</body>
</html>
