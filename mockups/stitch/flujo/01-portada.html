<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nubi y el Archipiélago del Sueño</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgMain: '#F7F5FF',
            surface: '#FFFFFF',
            textMain: '#1E1B3A',
            secondary: '#4B4777',
            primary: '#5043C9',
            accent: '#FFC15A',
            badgeGreen: '#0F6B4B',
            badgeBlue: '#1B5FA8',
            badgePurple: '#7A3FA0',
          },
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          borderRadius: {
            'custom': '12px',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #F7F5FF;
      color: #1E1B3A;
      -webkit-tap-highlight-color: transparent;
    }
    .font-title {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Gentle floating animation for calm game feel */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes softPulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .animate-float {
      animation: gentleFloat 4.5s ease-in-out infinite;
    }
    .animate-cloud-slow {
      animation: softPulse 6s ease-in-out infinite alternate;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 m-0 bg-slate-200 antialiased selection:bg-primary/20">

  <!-- Mobile screen container (360x640 optimized) -->
  <main class="w-full max-w-[360px] min-h-[640px] h-[640px] bg-gradient-to-b from-[#EAE4FF] via-[#F6EEFA] to-[#F7F5FF] relative overflow-hidden flex flex-col justify-between shadow-2xl rounded-2xl border border-white/60">

    <!-- Ambient Sky & Dream Island Silhouettes (Decorativo con niebla) -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
      <!-- Glow del amanecer -->
      <div class="absolute top-4 left-1/2 -translate-x-1/2 w-72 h-72 rounded-full bg-gradient-to-br from-[#FFE8BD]/50 via-[#E4DCFF]/40 to-transparent blur-2xl"></div>

      <!-- Siluetas de islas distantes entre la bruma del archipiélago -->
      <svg class="absolute top-16 left-[-20px] w-36 h-20 text-[#D8CEF8]/50" viewBox="0 0 140 70" fill="currentColor">
        <path d="M10,60 Q40,15 75,45 T135,60 Z" />
      </svg>
      <svg class="absolute top-20 right-[-15px] w-44 h-24 text-[#E2D9FF]/60" viewBox="0 0 160 80" fill="currentColor">
        <path d="M5,70 Q45,20 90,40 T155,70 Z" />
      </svg>

      <!-- Suave nube flotante de fondo -->
      <div class="absolute top-8 left-4 w-28 h-10 bg-white/40 rounded-full blur-sm animate-cloud-slow"></div>
      <div class="absolute top-24 right-5 w-24 h-8 bg-white/40 rounded-full blur-sm animate-cloud-slow" style="animation-delay: 2s;"></div>

      <!-- Bruma suave horizontal -->
      <div class="absolute top-44 left-0 right-0 h-16 bg-gradient-to-b from-transparent via-white/30 to-transparent"></div>
    </div>

    <!-- Header bar minimalista y cálido -->
    <header class="relative z-10 px-4 pt-3 flex items-center justify-between text-secondary">
      <div class="flex items-center gap-1.5 bg-white/80 backdrop-blur-md px-3 py-1 rounded-full border border-white shadow-xs">
        <span class="material-symbols-rounded text-primary text-[18px]">bedtime</span>
        <span class="text-xs font-semibold tracking-wide text-secondary font-nunito">Viaje guiado</span>
      </div>
      <button type="button" aria-label="Ajustes de sonido y calma" class="w-11 h-11 flex items-center justify-center rounded-full bg-white/75 hover:bg-white text-secondary hover:text-primary transition-colors border border-white/60 shadow-xs">
        <span class="material-symbols-rounded text-[20px]">volume_up</span>
      </button>
    </header>

    <!-- Centro: Nubi GRANDE y Título del Juego -->
    <section class="relative z-10 px-5 flex flex-col items-center text-center mt-1">
      
      <!-- NUBI (Blob grande central, cara amable, con etiqueta) -->
      <div class="relative w-40 h-32 flex items-center justify-center animate-float select-none">
        <!-- Resplandor cálido bajo Nubi -->
        <div class="absolute inset-0 bg-[#FFC15A]/25 rounded-full blur-xl scale-90 -translate-y-1"></div>

        <!-- Cuerpo blob de Nubi (SVG amigable y esponjoso) -->
        <svg class="w-full h-full drop-shadow-md" viewBox="0 0 180 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Sombra suave inferior -->
          <ellipse cx="90" cy="126" rx="55" ry="9" fill="#D3C9F4" fill-opacity="0.4"/>
          <!-- Forma orgánica y esponjosa de nube Nubi -->
          <path d="M42 108C30.9543 108 22 99.0457 22 88C22 78.4357 28.7291 70.4393 37.7661 68.4554C37.2625 66.0792 37 63.5786 37 61C37 42.7746 51.7746 28 70 28C77.4727 28 84.3752 30.4851 89.9248 34.6865C96.1132 28.0931 104.974 24 114.75 24C134.079 24 149.75 39.6711 149.75 59C149.75 60.3343 149.675 61.6508 149.529 62.9463C156.969 67.2415 162 75.3216 162 84.6C162 97.5235 151.523 108 138.6 108H42Z" fill="#FFFFFF"/>
          
          <!-- Mejillas ruborizadas suaves -->
          <ellipse cx="66" cy="74" rx="7" ry="4" fill="#FFC9C9" fill-opacity="0.75"/>
          <ellipse cx="114" cy="74" rx="7" ry="4" fill="#FFC9C9" fill-opacity="0.75"/>
          
          <!-- Ojos amables y sonrientes (estilo párpados relajados / arco feliz) -->
          <path d="M62 67C64 63.5 68 63.5 70 67" stroke="#1E1B3A" stroke-width="3" stroke-linecap="round"/>
          <path d="M110 67C112 63.5 116 63.5 118 67" stroke="#1E1B3A" stroke-width="3" stroke-linecap="round"/>
          
          <!-- Sonrisa tierna y pacífica -->
          <path d="M84 75C87.5 79 92.5 79 96 75" stroke="#1E1B3A" stroke-width="2.5" stroke-linecap="round"/>
          
          <!-- Estrellita o destello del sueño en la frente -->
          <path d="M90 42L91.5 46.5L96 48L91.5 49.5L90 54L88.5 49.5L84 48L88.5 46.5L90 42Z" fill="#FFC15A"/>
        </svg>

        <!-- Etiqueta de personaje con token exacto de acento -->
        <div class="absolute -bottom-1 bg-white/95 px-3 py-0.5 rounded-full border border-primary/15 shadow-xs flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-accent"></span>
          <span class="font-fredoka text-[11px] font-semibold text-primary tracking-wide">Nubi</span>
        </div>
      </div>

      <!-- Título del juego en Fredoka -->
      <h1 class="font-title text-[23px] leading-tight font-bold text-textMain mt-2 mb-1 px-1">
        Nubi y el Archipiélago del Sueño
      </h1>

      <!-- Subtítulo pedagógico y cálido -->
      <p class="text-[13px] leading-[18px] text-secondary font-medium max-w-[310px] mx-auto">
        Un viaje para entender tu sueño: aprende, juega y gana tu sello en cada isla.
      </p>
    </section>

    <!-- Zona de Acciones y Progresión suave -->
    <section class="relative z-10 px-5 pb-3 flex flex-col gap-2.5">

      <!-- Botón Primario Píldora: "Comenzar viaje" (Área táctil >=44px) -->
      <button type="button" class="w-full h-12 bg-primary hover:bg-[#4336B5] active:scale-[0.98] transition-all rounded-full text-white font-fredoka font-semibold text-base flex items-center justify-center gap-2 shadow-md shadow-primary/25 border border-white/20">
        <span>Comenzar viaje</span>
        <span class="material-symbols-rounded text-accent text-[20px]">explore</span>
      </button>

      <!-- Botón Secundario Píldora: "Seguir donde quedaste" con mini-progreso respetuoso -->
      <div class="bg-white/95 rounded-full p-1.5 border border-[#E4DEF8] shadow-xs flex items-center justify-between min-h-[48px] hover:border-primary/40 transition-colors">
        <button type="button" class="flex-1 flex items-center gap-2.5 pl-3 py-1 text-left active:opacity-90">
          <span class="material-symbols-rounded text-primary text-[20px]">play_circle</span>
          <div class="flex flex-col">
            <span class="font-fredoka text-[13px] font-semibold text-textMain leading-tight">Seguir donde quedaste</span>
            <span class="text-[11px] font-semibold text-secondary flex items-center gap-1">
              <span class="material-symbols-rounded text-[13px] text-badgeBlue">verified</span>
              <span>2 de 6 islas exploradas</span>
            </span>
          </div>
        </button>

        <!-- Mini-progreso visual: 6 puntitos, 2 llenos (sin alarma, sin porcentaje ni timer) -->
        <div class="flex items-center gap-1.5 pr-3 pl-1" aria-label="Progreso: 2 de 6 islas completadas">
          <span class="w-2.5 h-2.5 rounded-full bg-primary" title="Isla 1 explorada"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-primary" title="Isla 2 explorada"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#E5E0FA] border border-[#D5CFF0]" title="Isla 3 por descubrir"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#E5E0FA] border border-[#D5CFF0]" title="Isla 4 por descubrir"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#E5E0FA] border border-[#D5CFF0]" title="Isla 5 por descubrir"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#E5E0FA] border border-[#D5CFF0]" title="Isla 6 por descubrir"></span>
        </div>
      </div>

      <!-- Card de Privacidad y Calma (sin cuentas ni contraseñas) -->
      <div class="bg-white/60 backdrop-blur-xs rounded-custom px-3 py-1.5 flex items-center justify-center gap-1.5 text-center border border-white/80">
        <span class="material-symbols-rounded text-secondary text-[15px]">lock_person</span>
        <p class="text-[11px] text-secondary font-medium leading-tight">
          Sin cuentas ni contraseñas: tu viaje se queda en tu celular.
        </p>
      </div>

      <!-- Pie de pantalla: Enlace de fuentes y ayuda pedagógica -->
      <footer class="pt-0.5 pb-1 flex items-center justify-center">
        <button type="button" class="inline-flex items-center gap-1 text-[12px] font-bold text-secondary hover:text-primary transition-colors py-1 px-3 rounded-full min-h-[44px]">
          <span class="material-symbols-rounded text-[17px] text-primary">menu_book</span>
          <span>Fuentes y ayuda</span>
        </button>
      </footer>
    </section>

  </main>

</body>
</html>
